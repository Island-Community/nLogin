# Configurações gerais de segurança.
security:
  # Define o tempo para um jogador se autenticar (em segundos).
  auth-timeout: 90

  # Define se comandos de alto risco do nLogin serão desativados in-game.
  # - Esta opção pode previnir ataques de hacking que removem o registro de administradores.
  force-console-usage: true

  nickname:
    # Define o regex para a validação de nicknames.
    validation-regex: '([a-zA-Z0-9_]{3,16})'

    kick-unregistered:
      # Define se jogadores não registrados deverão ser bloqueados.
      enable: false

      bypass:
        # Define se jogadores premium deverão ser ignorados pelo bloqueio.
        premium: false

        # Define se jogadores bedrock deverão ser ignorados pelo bloqueio.
        bedrock: false

        # Define a lista de IPs que serão ignorados pelo bloqueio.
        ips: []

  ip:
    # Define se o plugin deve ignorar a verificação "Este jogador já está online" se o IP for mesmo que o registrado.
    # - Este recurso é útil caso o player perca a conexão com o servidor e tente entrar novamente.
    bypass-online-check-with-same-ip: true

    limit:
      # Define se o limitador de contas por IP deverá ser usado.
      # - Esta opção pode evitar contas falsas.
      enable: true

      # Define o número máximo de registros por endereço de IP.
      max: 3

      # Define se o limitador de IP deve bloquear as contas de entrarem no servidor.
      prevent-login: false

      bypass:
        # Define se jogadores registrados deverão ser ignorados pelo limite de IP.
        registered: true

        # Define se jogadores premium deverão ser ignorados pelo limite de IP.
        premium: true

        # Define se jogadores bedrock deverão ser ignorados pelo limite de IP.
        bedrock: true

        # Define a lista de IPs que ignoram a limitação.
        ips:
          - '127.0.0.1'
          - 'localhost'

  passwords:
    # Define o tamanho mínimo das senhas.
    small: 5

    # Define o tamanho máximo das senhas.
    large: 32

    secure:
      # Define se verificações de força da senha serão feitas.
      enable: false

      # Define se jogadores registrados devem atualizar suas senhas se não atingirem os requisitos de senha segura.
      enforce: false

      # Define o padrão usado para classificar uma senha como segura.
      #
      #  | Por padrão, as seguintes condições são verificadas:
      #- |=> 1. Contém um número
      #- |=> 2. Contém um caractere maíusculo,
      #- |=> 3. Contém um caractere minúsculo.
      #- |=> 4. Contém um símbolo especial (!"@#$%^&*?)
      #
      secure-regex: '(?=\S*\d)(?=\S*[A-Z])(?=\S*[a-z])(?=\S*[!@#$%^&*?])\S*$'

  bruteforce:
    # Define o número máximo de tentativas incorretas que um jogador pode realizar.
    # - Ao usar o valor "1" o jogador será desconectado imediatamente ao errar.
    max-auth-tries: 1

    punish:
      # Define se ataques de força bruta serão punidos automaticamente.
      # - Após muitas tentativas incorretas, o endereço de IP suspeito será bloqueado.
      enable: true

      # Define o tempo da punição por suspeita de ataque de força bruta (em minutos).
      duration: 15

  hashing:
    # Define o algoritimo de hashing utilizado.
    #
    # - Opções disponíveis:
    #
    #  | O custo computacional dos hashings deve aumentar (mas não necessariamente) de baixo para cima.
    #  |=> MD5
    #  |=> SHA256
    #  |=> SHA512
    #  |=> BCRYPT2Y
    #  |=> BCRYPT2A
    #  |=> PBKDF2
    #  |=> ARGON2ID
    #  |=> ARGON2I
    #  |=> ARGON2D
    #
    algorithm: "BCRYPT2A"

    bcrypt:
      rounds: 10

    pbkdf2:
      iterations: 10000
      algorithm: "HmacSHA512"

    argon2:
      iterations: 5
      memory: 32
      parallelism: 1

