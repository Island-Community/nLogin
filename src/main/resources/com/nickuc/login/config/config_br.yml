# Configurações do banco de dados.
database:
  # Define o tipo de banco de dados usado.
  #
  # - Opções disponíveis:
  #  |=> MariaDB
  #  |=> MySQL
  #  |=> SQLite
  type: SQLite

  remote:
    # Define as informações do MariaDB/MySQL.
    # - Tutorial para instalação: https://docs.nickuc.com/nlogin/mysql
    hostname: "localhost:3306"
    database: "nlogin"
    username: "root"
    password: ""

    # Define as propriedades da conexão.
    # - Não altere esta informação se você não sabe o que está fazendo!
    properties:
      #useSSL: false
      #sslMode: disable
      #verifyServerCertificate: false
      useUnicode: true
      characterEncoding: "utf8"

  # Define as configurações da pool de conexões.
  # - Não altere esta informação se você não sabe o que está fazendo!
  pool-settings:
    maximum-pool-size: 10
    minimum-idle: 10
    maximum-lifetime: 1800000 # 30 minutos
    connection-timeout: 5000 # 5 segundos

  table:
    account:
      # Define o nome da tabela de contas do nLogin.
      # - Não altere esta informação se você não sabe o que está fazendo!
      table-name: "nlogin"

      # Define o nome das colunas.
      # - Não altere esta informação se você não sabe o que está fazendo!
      columns:
        ai: "ai"
        last-name: "last_name"
        unique-id: "unique_id"
        mojang-id: "mojang_id"
        bedrock-id: "bedrock_id"
        password: "password"
        premium: "premium"
        last-ip: "last_ip"
        last-seen: "last_seen"
        creation-date: "creation_date"
        email: "email"
        discord: "discord"
        settings: "settings"

    data:
      # Define o nome da tabela de dados do nLogin.
      # - Não altere esta informação se você não sabe o que está fazendo!
      table-name: "nlogin_data"

      # Define o nome das colunas.
      # - Não altere esta informação se você não sabe o que está fazendo!
      columns:
        id: "id"
        key: "key"
        value: "value"

# Configurações do serviço de mensagens
redis:
  # Define as informações do Redis.
  enable: false
  hostname: localhost
  username: ""
  password: ""
  ssl: false

