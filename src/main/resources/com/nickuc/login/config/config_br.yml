# Configurações da interface do usuário (UI).
ui:
  # Define qual será o modo de operação dos menus (dialogs)
  # - Este recurso só funciona para versões 1.21.6 ou superiores.
  #
  # - Opções disponíveis:
  #  |=> NONE: desativa os dialogs.
  #  |=> PRE_LOGIN: envia antes de entrar no servidor.
  #  |=> AFTER_LOGIN: envia depois de entrar no servidor.
  #
  show-dialogs: PRE_LOGIN

  # Define se mensagens na tela serão enviadas.
  use-title-bar: true

  # Define se mensagens em actionbars serão enviadas.
  use-action-bar: true

  # Define se a mensagem de tempo restante será enviada.
  use-action-bar-timer: true

  # Define se efeitos sonoros serão enviados.
  use-sounds: true

  # Define se as mensagens do chat serão desativadas até que a autenticação seja concluída.
  remove-chat-messages: true

  # Define se a mensagem de entrada será removida.
  remove-join-message: false

  # Define se o idioma do nLogin deverá se adaptar a linguagem do Minecraft.
  language-by-client: false

