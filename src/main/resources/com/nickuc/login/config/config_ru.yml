# Общие настройки безопасности.
security:
  # Устанавливает время аутентификации игрока (в секундах).
  auth-timeout: 90

  # Устанавливает, будут ли команды nLogin с высокой степенью риска отключены в игре.
  # - Эта опция может предотвратить хакерские атаки, удаляющие регистрацию администратора.
  force-console-usage: true

  nickname:
    # Устанавливает regex для проверки ников.
    validation-regex: '([a-zA-Z0-9_]{3,16})'

    kick-unregistered:
      # Определяет, следует ли блокировать незарегистрированных игроков.
      enable: false

      bypass:
        # Определяет, следует ли игнорировать премиум-игроков при применении ограничения.
        premium: false

        # Определяет, следует ли игнорировать игроков Bedrock при применении ограничения.
        bedrock: false

        # Определяет список IP-адресов, которые будут игнорироваться при применении ограничения.
        ips: []

  ip:
    # Устанавливает, должен ли плагин игнорировать проверку "Этот игрок уже онлайн", если IP совпадает с зарегистрированным.
    # - Эта функция полезна, если игрок теряет связь с сервером и пытается войти в систему снова.
    bypass-online-check-with-same-ip: true

    limit:
      # Устанавливает, следует ли использовать ограничитель учетных записей для каждого IP-адреса.
      # - Этот параметр может предотвратить появление поддельных учетных записей.
      enable: true

      # Устанавливает максимальное количество записей на один IP-адрес.
      max: 3

      # Определяет, должен ли IP-ограничитель блокировать доступ учетных записей к серверу.
      prevent-login: false

      bypass:
        # Определяет, должны ли зарегистрированные игроки игнорироваться IP-лимитом.
        registered: true

        # Определяет, должны ли премиум-игроки игнорировать IP-лимит.
        premium: true

        # Определяет, должны ли игроки bedrock игнорировать IP-лимит.
        bedrock: true

        # Определяет список IP-адресов, которые игнорируют ограничение.
        ips:
          - '127.0.0.1'
          - 'localhost'

  passwords:
    # Устанавливает минимальный размер пароля.
    small: 5

    # Устанавливает максимальный размер пароля.
    large: 32

    secure:
      # Определяет, должна ли выполняться проверка надежности пароля.
      enable: false

      # Определяет, должны ли зарегистрированные игроки обновлять свои пароли, если их пароли не соответствуют шаблону безопасного пароля.
      enforce: false

      # Определяет шаблон, используемый для классификации пароля как безопасного.
      #
      #  | По умолчанию проверяется, соответствует ли пароль:
      #- |=> 1. Содержит число
      #- |=> 2. Содержит прописной английский символ
      #- |=> 3. Содержит строчный английский символ
      #- |=> 4. Содержит специальный символ (!"@#$%^&*?)
      #
      secure-regex: '(?=\S*\d)(?=\S*[A-Z])(?=\S*[a-z])(?=\S*[!@#$%^&*?])\S*$'

  bruteforce:
    # Устанавливает максимальное количество неправильных попыток, которые может сделать игрок.
    # - При использовании значения "1" игрок будет немедленно отключен при совершении ошибки.
    max-auth-tries: 1

    punish:
      # Определяет, будут ли атаки грубой силы наказываться автоматически.
      # - После слишком большого количества неправильных попыток подозрительный IP-адрес будет заблокирован.
      enable: true

      # Устанавливает время наказания за предполагаемую атаку грубой силы (в минутах).
      duration: 15

  hashing:
    # Определяет используемый алгоритм хэширования.
    #
    # - Доступные опции:
    #
    #  | Вычислительные затраты хэширования должны увеличиваться (но не обязательно) снизу вверх.
    #  |=> MD5
    #  |=> SHA256
    #  |=> SHA512
    #  |=> BCRYPT2Y
    #  |=> BCRYPT2A
    #  |=> PBKDF2
    #  |=> ARGON2ID
    #  |=> ARGON2I
    #  |=> ARGON2D
    #
    algorithm: "BCRYPT2A"

    bcrypt:
      rounds: 10

    pbkdf2:
      iterations: 10000
      algorithm: "HmacSHA512"

    argon2:
      iterations: 5
      memory: 32
      parallelism: 1

