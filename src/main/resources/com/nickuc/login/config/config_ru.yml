# Установите версию файла.
language-version: 5

# Установите язык плагина
#
# - Доступные переводы:
#
# |=> Арабский: messages_ar.yml
# |=> Болгария: messages_bg.yml
# |=> Китайский: messages_cn.yml
# |=> Чешский: messages_cz.yml
# |=> немецкий: messages_de.yml
# |=> Английский: messages_en.yml
# |=> Испанский: messages_es.yml
# |=> французский: messages_fr.yml
# |=> Венгерский: messages_hu.yml
# |=> Индонезийский: messages_id.yml
# |=> Итальянский: messages_it.yml
# |=> Японский: messages_jp.yml
# |=> Литовский: messages_lt.yml
# |=> Польский: messages_pl.yml
# |=> Португальский: messages_br.yml
# |=> Румынский: messages_ro.yml
# |=> Русский: messages_ru.yml    <--- (нынешний язык)
# |=> турецкий: messages_tr.yml
# |=> Украинский: messages_ua.yml
# |=> вьетнамский: messages_vn.yml
#
# - При смене языка текущий файл НЕ будет сброшен.
language-file: "messages_ru.yml"

