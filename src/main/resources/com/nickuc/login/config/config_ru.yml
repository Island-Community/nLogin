# Настройки Limbo.
# - Limbo - это система защиты информации игрока.
# - В случае внезапного отключения (например, отключения питания)
# в действие вступят файлы limbo.
limbo:
  # Устанавливает время ожидания скрытия информации об игроке.
  #
  # => Указанное значение должно быть в тиках. Чтобы вычислить необходимое количество тиков,
  #    умножьте значение (в секундах) на 20.
  #
  #    - Пример:
  #     2 секунды X 20 тиков = 40 тиков.
  #
  delay: 0

  # Определяет, должен ли лимбо скрывать информацию игроков.
  #
  # => Список информации об игроке:
  #   - скорость и режим полета;
  #   - скорость при ходьбе;
  #   - жизнь;
  #   - сытость;
  #   - [...]
  #
  # - Рекомендуется отключить эту опцию в случае конфликтов с другими
  #   плагинами, которые работают с этими параметрами (например, плагинами лобби).
  hide-player-stats: true

  # Устанавливает, должны ли предметы быть скрыты перед входом в систему.
  hide-player-inventory: true

  # Устанавливает, следует ли скрывать других игроков перед входом в игру.
  # - Эта опция может предотвратить спам ботов в списке игроков сервера.
  hide-unauthenticated-players: true

  # Определяет, следует ли блокировать движение перед авторизацией.
  block-player-movement: true

  # Определяет, будет ли эффект ослепления добавляться перед входом в систему.
  use-blindness-effect: false

  # Устанавливает, будет ли игрок телепортирован в безопасное место при входе.
  # - Рекомендуется активировать опцию, если не задан спаун.
  highest-block-location: false

  unrestricted:
    # Определяет псевдонимы, которые будут пропускать процесс аутентификации.
    #
    # - Эта опция может быть полезна для МОДов или плагинов, которые подменяют
    #   поведение игрока.
    #
    # - Примеры:
    #  - '[ThaumcraftTablet]''
    #  - '[BuildCraft]'
    #  - 'ComputerCraft'
    #
    # => Используйте эту функцию на свой страх и риск.
    nicknames:
    #- '[ThaumcraftTablet]'
    #- '[BuildCraft]'
    #- 'ComputerCraft'

    # Задает имена инвентарей, которые не будут блокироваться перед входом в систему.
    # - Если вы разработчик, то лучше использовать более высокий приоритет для
    #   вашего события инвентаризации (например, HIGH или HIGHEST), а затем удалить
    #   отмену nLogin - "Event#setCancelled(false)"
    inventories:
    #- 'My Inventory Name'

