# Настройки пользовательского интерфейса.
ui:
  # Определяет режим работы диалоговых окон.
  # - Эта функция работает только в версиях 1.21.6 и выше.
  #
  # - Доступные опции:
  #  |=> NONE: отключает диалоговые окна.
  #  |=> PRE_LOGIN: отправляет перед входом на сервер.
  #  |=> AFTER_LOGIN: отправляет после входа на сервер.
  #
  show-dialogs: PRE_LOGIN

  # Устанавливает, будут ли отправляться экранные сообщения.
  use-title-bar: true

  # Устанавливает, будут ли отправляться сообщения на панелях действий.
  use-action-bar: true

  # Устанавливает, будет ли отправляться сообщение об оставшемся времени.
  use-action-bar-timer: true

  # Устанавливает, будут ли отправляться звуковые эффекты.
  use-sounds: true

  # Определяет, будут ли сообщения чата отключены до завершения аутентификации.
  remove-chat-messages: true

  # Устанавливает, будет ли удаляться входное сообщение.
  remove-join-message: false

  # Определите, должен ли язык nLogin быть адаптирован к языку Minecraft.
  language-by-client: false

