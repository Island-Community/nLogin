# Настройки баз данных.
database:
  # Устанавливает тип используемой базы данных.
  #
  # - Доступные опции:
  #  |=> MariaDB
  #  |=> MySQL
  #  |=> SQLite
  type: SQLite

  remote:
    # Определяет информацию о MariaDB/MySQL.
    # - Учебник по установке: https://docs.nickuc.com/nlogin/mysql
    hostname: "localhost:3306"
    database: "nLogin"
    username: "root"
    password: ""

    # Установите свойства соединения.
    # - Не изменяйте эту информацию, если вы не знаете, что делаете!
    properties:
      #useSSL: false
      #sslMode: disable
      #verifyServerCertificate: true
      useUnicode: true
      characterEncoding: "utf8"

  # Определяет параметры пула соединений.
  # - Не изменяйте эту информацию, если вы не знаете, что делаете!
  pool-settings:
    maximum-pool-size: 10
    minimum-idle: 10
    maximum-lifetime: 1800000 # 30 минут
    connection-timeout: 5000 # 5 секунд

  table:
    account:
      # Задает имя таблицы учетных записей nLogin.
      # - Не изменяйте эту информацию, если вы не знаете, что делаете!
      table-name: "nlogin"

      # Задает имя столбцов nLogin.
      # - Не изменяйте эту информацию, если не знаете, что делаете!
      columns:
        ai: "ai"
        last-name: "last_name"
        unique-id: "unique_id"
        mojang-id: "mojang_id"
        bedrock-id: "bedrock_id"
        password: "password"
        premium: "premium"
        last-ip: "last_ip"
        last-seen: "last_seen"
        creation-date: "creation_date"
        email: "email"
        discord: "discord"
        settings: "settings"

    data:
      # Задает имя таблицы данных nLogin.
      # - Не изменяйте эту информацию, если вы не знаете, что делаете!
      table-name: "nlogin_data"

      # Задает имя столбцов nLogin.
      # - Не изменяйте эту информацию, если не знаете, что делаете!
      columns:
        id: "id"
        key: "key"
        value: "value"

# Настройки службы обмена сообщениями
redis:
  # Определяет информацию о Redis.
  enable: false
  hostname: localhost
  username: ""
  password: ""
  ssl: false

