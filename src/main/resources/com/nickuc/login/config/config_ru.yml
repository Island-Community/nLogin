# Параметры команды.
commands:
  # Определяет список команд, которые будут выполняться после регистрации.
  #
  # - Доступные опции:
  #  |=> @console: выполняет команду на консоли.
  #  |=> @delay <время в тиках>: добавляет задержку к команде.
  #  |=> @proxy: выполняет команду на прокси-сервере (только если вы его используете).
  #  |=> @server <серверы, разделенные на ",">: выполняет команду, только если игрок подключен к
  #      списку определенных серверов (только при использовании прокси-сервера).
  #
  #      Пример: @server lobby1,lobby2.
  #
  after-register:
  #- "@console tell @player Welcome to the server!" # запустить в консоли
  #- "@delay 40 /kit starter" # подождать 40 тиков (2с)

  # Определяет список команд, которые будут выполняться после аутентификации.
  #
  # - Доступные опции:
  #  |=> @console: выполняет команду на консоли.
  #  |=> @delay <время в тиках>: добавляет задержку к команде.
  #  |=> @proxy: выполняет команду на прокси-сервере (только если вы его используете).
  #  |=> @server <серверы, разделенные на ",">: выполняет команду, только если игрок подключен к
  #      списку определенных серверов (только при использовании прокси-сервера).
  #
  #      Пример: @server lobby1,lobby2.
  #
  after-login:
  #- "@console @proxy send @player lobby" # запустить в консоли прокси (тарзанка, скорость и т.д.)

  # Определите список разрешенных команд перед авторизацией.
  allowed-commands:
  #- "/loginstaff"

  changepass:
    enable: true
    commands: [changepass, changepassword]
    description: Команда изменения зарегистрированного пароля.
    permission: null
  discord:
    enable: true
    commands: [discord]
    description: Команда для управления 2FA с помощью учетных записей Discord.
    permission: nlogin.command.discord
  email:
    enable: true
    commands: [email]
    description: Команда для управления 2FA с помощью учетных записей электронной почты.
    permission: nlogin.command.email
  login:
    enable: true
    commands: [login, l, log]
    description: Команда для входа на сервер.
    permission: null
  offline:
    enable: true
    commands: [offline, cracked]
    description: Команда для пометки учетной записи как автономной.
    permission: null
  premium:
    enable: true
    commands: [premium]
    description: Команда для пометки учетной записи как премиум.
    permission: null
  recover:
    enable: true
    commands: [recover]
    description: Команда восстановления доступа к зарегистрированным счетам.
    permission: null
  register:
    enable: true
    commands: [register, reg]
    description: Команда для регистрации на сервере.
    permission: null
  unregister:
    enable: false
    commands: [unregister]
    description: Команда для отмены регистрации.
    permission: null