    welcome-message-1:
      title: '&6Salut, @player !'
      subtitle: '&eBienvenue sur nLogin !'
      delays:
        fadeIn: 10
        stay: 60
        fadeOut: 10
    welcome-message-2:
      title: ''
      subtitle: '&aVeuillez lire l''avertissement avant de continuer.'
      delays:
        fadeIn: 10
        stay: 60
        fadeOut: 10
    welcome-message-3:
      title: ''
      subtitle: '&fCliquez sur le bouton {0} &fpour continuer.'
      delays:
        fadeIn: 10
        stay: 80
        fadeOut: 10
