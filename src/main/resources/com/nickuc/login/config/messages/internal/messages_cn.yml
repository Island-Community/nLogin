      hover: |-
        &7&a稳定渠道&7的漏洞较少，但功能也较少。

        &6建议：&f适用于已公开发布的服务器。
    latest:
      text: '&6[最新版]'
      hover: |-
        &7&6最新版渠道&7始终提供最新的版本。

        &6建议：&f适用于想要最新功能的服务器。
