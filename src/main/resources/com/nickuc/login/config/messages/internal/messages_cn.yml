update:
  stable: '&a稳定版'
  latest: '&b最新版'

notification:
  setup:
    select-language:
    - ''
    - ' &e我们检测到你正在使用 &6{0} &e语言。'
    - ''
    - ' &6你想在 nLogin 中使用这个语言吗？'
    - ''
    - ' &c‼ &e这将影响所有玩家的语言！'
    - ''
    permission-required:
    - ''
    - ' &e要配置 nLogin，你需要成为&c管理员&e。'
    - ''
    - ' &6请将权限 &f"{0}" &6添加到你的权限插件中。'
    - ''
    - ' &c‼ &e权限添加后，设置将继续进行。'
    - ''
    welcome-message:
    - ''
    - ' &a非常感谢你选择 nLogin！ :)'
    - ''
    - ' &6为了你的安全，请阅读以下信息：'
    - '  &c切勿从未知来源下载 nLogin。'
    - '  &c修改过的版本可能包含恶意软件。'
    - ''
    - ' &a受信任的来源：'
    - '  &7官网: &fnickuc.com'
    - '  &7GitHub: &fgithub.com/nickuc-com'
    - '  &7OpeNLogin 安装程序（来自 &fSpigot &7或 &fGitHub&7）'
    - ''
    - ' &a官方支持：'
    - '  &7文档: &fdocs.nickuc.com/nlogin/'
    - '  &7Discord: &fnickuc.com/discord'
    - '  &7邮箱: &fsupport@nickuc.com'
    - ''
    configure-version-channel:
    - ''
    - ' &6选择你偏好的版本渠道。'
    - ''
    - ' &c‼ &e你之后可以通过运行 &f{0} &e来更改此设置。'
    - ''
    configure-auto-or-manual-updates:
    - ''
    - ' &6选择你偏好的更新方式。'
    - ''
    - ' &c‼ &e你之后可以通过运行 &f{0} &e来更改此设置。'
    - ''
    configure-password-algorithm:
    - ''
    - ' &6选择密码的首选加密类型。'
    - ''
    - ' &c‼ &e你之后可以在 &fconfig.yml &e中手动更改此选项。'
    - ''
    enable-dialogs:
    - ''
    - ' &6你想使用菜单（对话框）作为身份验证界面吗？'
    - ''
    - ' &e对话框会用可自定义的菜单取代基于命令的身份验证。'
    - ''
    - ' &c‼ &e此功能仅适用于使用 1.21.6 或更高版本的客户端。'
    - ''
    configure-dialogs:
    - ''
    - ' &6选择你偏好的对话框显示方式。'
    - ''
    - ' &c‼ &e你可以在 &fconfig.yml &e中手动更改此选项。'
    - ''
    configure-bungeeguard:
    - ''
    - ' &6你想在服务器上配置 BungeeGuard+ 吗？'
    - ''
    - ' &c‼ &e在以下情况下，建议安装 BungeeGuard+：'
    - '  &8⋆ &e你使用任何基于 BungeeCord 的代理。'
    - '  &8⋆ &e你使用 Velocity，但无法使用 &f"MODERN" &e转发方式。'
    - ''
    - ' &c‼ &e你需要在所有服务器上安装 BungeeGuard+ 的 JAR 文件。'
    - ''
    start-premium-configuration:
    - ''
    - ' &a恭喜你购买了 &6⭐ nLogin Premium'
    - ''
    - ' &6以下是新解锁的功能：'
    - ''
    - '  &8⋆ &e自动登录 &7适用于使用正版 Minecraft 的用户。'
    - '  &8⋆ &e通过 Discord 和邮箱进行&e两步&7验证。'
    - '  &8⋆ &e使用 IP 地址登录时的&e登录会话&7。'
    - '  &8⋆ &e更高优先级的&e支持处理&7。'
    - '  &8⋆ &e在 Discord 群组中的&e客户标签&7。'
    - ''
