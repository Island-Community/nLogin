    safer:
      text: '&a[更安全]'
      hover: '&7将使用更安全的算法来保护密码。'
    faster:
      text: '&c[更快速]'
      hover: '&7将使用安全性较低的算法来保护密码。'
    pre-login:
      text: '&a[登录前显示]'
      hover: '&7对话框将在&a进入&7服务器之前显示。'
    after-login:
      text: '&9[登录后显示]'
      hover: '&7对话框将在&9进入&7服务器之后显示。'
    install:
