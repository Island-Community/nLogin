  - ''
  - ' &c✖ &c你的 &fnLogin v{0} &c许可证未能成功激活。'
  - '  &c请尝试在官网重新下载 JAR 文件：'
  - '  &b{1}'
  - ''
  - ' &c‼ &c如果问题仍然存在，我们建议你联系开发者。'
  - '  &7要查看联系方式列表，请使用命令 {2}'
  - ''
  premium-expired:
  - ''
  - ' &c✖ &c你的 &fnLogin v{0} &c许可证未能成功激活。'
  - '  &c请通过网站续订你的许可证：&b{1}'
  - ''
  premium-recommendation:
  - ''
  - ' &7想让你的登录更加便捷吗？'
  - ' &7现在获取 nLogin 的正版版本'
  - ' &7并为你的用户启用自动登录。'
  - ''
  - ' [&a点击这里了解更多信息。]'
  - ''
  button:
    start-setup:
      text: '&a[✔ 开始设置]'
      hover: '&7点击这里开始插件的设置。'
    stable:
