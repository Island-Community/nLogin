    - ''
    - ' &6对于 1.18.2 及以下版本，无法自动为正版/离线玩家添加附加后缀。'
    - ''
    - ' &e你需要为正版和离线玩家手动配置两个不同的 IP。'
    - ''
    - ' &c‼ &e有关此功能的更多信息，请访问：&bdocs.nickuc.com/nlogin/username-appender'
    - ''
    enable-restrict-premium-nicknames:
    - ''
    - ' &6是否限制离线玩家使用正版昵称进行注册？ &e（适用于新账户）'
    - ''
    - ' &c‼ &e即使该名称可供注册，离线玩家也将无法使用&f正版昵称（例如 Notch）&e。'
    - ''
    enable-challenge-premium-nicknames:
    - ''
    - ' &6是否检测玩家是否正在使用正版账户？ &e（通过昵称）'
    - ''
    - ' &c‼ &e离线玩家在首次登录服务器时，可能会收到一条无法自定义的消息，提示 &f"Invalid session"&e。'
    - ''
    enable-premium-question:
    - ''
    - ' &6是否检测玩家是否正在使用正版账户？ &e（通过交互式提问）'
    - ''
    - ' &c‼ &e如果你想确保正版玩家获得 Mojang UUID，建议启用此选项。'
    - ''
    skip-premium-register:
    - ''
    - ' &6是否跳过&b正版玩家&6的密码注册请求？'
    - ''
    - ' &c‼ &e如果玩家的密码会用于网页集成（例如服务器网站），建议禁用此选项。'
    - ''
    skip-bedrock-register:
    - ''
    - ' &6是否跳过&cBedrock 玩家&6的密码注册请求？'
    - ''
    - ' &c‼ &e如果玩家的密码会用于网页集成（例如服务器网站），建议禁用此选项。'
    - ''
    nantibot-recommendation:
    - ''
    - ' &6我们建议安装 &fnAntiBot &6，以防止'
    - ' &6你的服务器受到机器人攻击。'
    - ''
    - ' &c‼ &e有关此插件的更多信息，请&6点击这里&e。'
    - ''
    nchat-recommendation:
    - ''
    - ' &6我们建议安装 &fnChat&6，'
    - ' &6这是一款完全替代 Legendchat 的聊天插件。'
    - ''
    - ' &c‼ &e有关此插件的更多信息，请&6点击这里&e。'
    - ''
    recommend-spawn-set:
    - ''
    - ' &6登录前，玩家坐标&c不会&6受到保护。'
    - ''
    - ' &c‼ &e请使用命令 &f{0} &e设置一个安全的出生点。'
    - ''
    finish-configuration:
    - ''
    - ' &6确认退出设置模式并保存所有更改。'
    - ''
    - ' &c‼ &e确认后，所有玩家都将被断开连接。'
    - ''
  update-available-confirmation:
  - ''
  - ' &e有新的 nLogin 版本可用{0} {1}'
  - ''
  - ' &6你想确认更新吗？'
  - ''
