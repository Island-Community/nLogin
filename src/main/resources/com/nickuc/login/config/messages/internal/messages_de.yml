  - ''
  - ' &c✖ &cDeine &fnLogin v{0} &cLizenz konnte nicht erfolgreich aktiviert werden.'
  - '  &cVersuche, die JAR erneut von der Webseite herunterzuladen:'
  - '  &b{1}'
