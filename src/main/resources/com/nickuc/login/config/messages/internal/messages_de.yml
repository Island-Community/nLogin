  - '  &cErneuere deine Lizenz über die Webseite: &b{1}'
  - ''
  premium-recommendation:
  - ''
  - ' &7Möchtest du deinen Login praktischer gestalten?'
  - ' &7Hol dir jetzt die Premium-Version von nLogin'
  - ' &7und aktiviere den automatischen Login für deine Benutzer.'
  - ''
  - ' [&aKlicke hier für weitere Informationen.]'
  - ''
  button:
    start-setup:
      text: '&a[✔ Setup starten]'
      hover: '&7Klicke hier, um das Setup des Plugins zu starten.'
    stable:
      text: '&a[Stabile Version]'
      hover: |-
        &7Der &aStabil-Kanal &7hat weniger Fehler, aber auch weniger Funktionen.

        &6Empfehlung: &ffür veröffentlichte Server.
    latest:
      text: '&6[Neueste Version]'
      hover: |-
        &7Der &6Neueste-Kanal &7bietet immer die neuesten Versionen.

        &6Empfehlung: &ffür Server, die die neuesten Funktionen wollen.
