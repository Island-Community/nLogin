    - ''
    skip-bedrock-register:
    - ''
    - ' &6Passwort-Registrierung für &cBedrock-Spieler&6 überspringen?'
    - ''
    - ' &c‼ &eEs wird empfohlen, diese Option zu deaktivieren, wenn das Passwort der Spieler in einer Web-Integration (z.B. Server-Webseite) verwendet wird.'
    - ''
