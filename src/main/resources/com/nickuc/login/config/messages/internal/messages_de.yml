    - ''
    - ' &6Spielerkoordinaten werden vor dem Login &cNICHT &6geschützt.'
    - ''
    - ' &c‼ &eLege mit dem Befehl &f{0} &eeinen sicheren Spawn-Punkt fest.'
    - ''
