      text: '&a[Automatische Updates]'
      hover: '&7Es wird keine Bestätigung für das Update erforderlich sein.'
    manual:
      text: '&9[Manuelle Bestätigung]'
      hover: '&7Du musst das Update mit einer Benachrichtigung wie dieser bestätigen.'
    safer:
      text: '&a[Sicherer]'
      hover: '&7Ein sichererer Algorithmus wird verwendet, um Passwörter zu schützen.'
    faster:
      text: '&c[Schneller]'
      hover: '&7Ein weniger sicherer Algorithmus wird verwendet, um Passwörter zu schützen.'
    pre-login:
      text: '&a[Vorher anzeigen]'
      hover: '&7Die Dialoge werden &avor dem Betreten &7des Servers angezeigt.'
    after-login:
      text: '&9[Danach anzeigen]'
      hover: '&7Die Dialoge werden &9nach dem Betreten &7des Servers angezeigt.'
    install:
      text: '&a[⬇ Installieren]'
      hover: '&7Klicke hier, um das Plugin automatisch zu installieren.'
    skip:
      text: '&7[✖ Überspringen]'
