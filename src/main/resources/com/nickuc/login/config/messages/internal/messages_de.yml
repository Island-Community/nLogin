    - ''
    - ' &6Wir empfehlen die Installation von &fnAntiBot&6,'
    - ' &6um deinen Server vor Bot-Angriffen zu schützen.'
    - ''
    - ' &c‼ &eWeitere Informationen zu diesem Plugin findest du, wenn du &6hier klickst&e.'
    - ''
    nchat-recommendation:
    - ''
    - ' &6Wir empfehlen die Installation von &fnChat&6,'
    - ' &6einem Chat-Plugin, das Legendchat vollständig ersetzt.'
    - ''
    - ' &c‼ &eWeitere Informationen zu diesem Plugin findest du, wenn du &6hier klickst&e.'
    - ''
