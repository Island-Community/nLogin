    - ''
    - ' &6Alege metoda de actualizare preferată.'
    - ''
    - ' &c‼ &ePoți schimba asta mai târziu rulând &f{0}&e.'
    - ''
    configure-password-algorithm:
    - ''
    - ' &6Selectează tipul de criptare preferat pentru parole.'
    - ''
    - ' &c‼ &ePoți schimba manual această opțiune mai târziu în &fconfig.yml&e.'
    - ''
    enable-dialogs:
    - ''
    - ' &6Dorești să folosești meniurile (dialogs) ca interfață de autentificare?'
    - ''
    - ' &eDialogs înlocuiesc autentificarea bazată pe comenzi cu meniuri personalizabile.'
    - ''
    - ' &c‼ &eAceastă funcție funcționează doar pentru clienți care folosesc 1.21.6 sau o versiune mai nouă.'
    - ''
    configure-dialogs:
    - ''
    - ' &6Alege modul preferat de afișare a dialogs.'
    - ''
    - ' &c‼ &ePoți schimba manual această opțiune în &fconfig.yml&e.'
    - ''
    configure-bungeeguard:
    - ''
    - ' &6Dorești să configurezi BungeeGuard+ pe server?'
    - ''
    - ' &c‼ &eSe recomandă instalarea BungeeGuard+ în aceste situații:'
    - '  &8⋆ &eFolosești orice proxy bazat pe BungeeCord.'
    - '  &8⋆ &eFolosești Velocity, dar forwarding-ul &f"MODERN" &enu poate fi folosit.'
    - ''
    - ' &c‼ &eVa trebui să instalezi JAR-ul BungeeGuard+ pe toate serverele.'
    - ''
