    - ''
    - ' &aFelicitări pentru achiziționarea &6⭐ nLogin Premium'
    - ''
    - ' &6Iată noile funcții deblocate:'
    - ''
    - '  &8⋆ &eConectare automată &7pentru utilizatorii cu Minecraft premium.'
    - '  &8⋆ &eAutentificare &7în doi pași prin Discord și Email.'
    - '  &8⋆ &eSesiuni de conectare &7la conectarea cu adresa IP.'
    - '  &8⋆ &eSuport cu &7prioritate mai mare.'
    - '  &8⋆ &eEtichetă de client &7în grupul Discord.'
    - ''
