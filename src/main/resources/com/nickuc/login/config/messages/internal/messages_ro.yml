update:
  stable: '&aStabilă'
  latest: '&bCea mai recentă'

notification:
  setup:
    select-language:
    - ''
    - ' &eAm detectat că folosești limba &6{0}&e.'
    - ''
    - ' &6Dorești să folosești această limbă pentru nLogin?'
    - ''
    - ' &c‼ &eAcest lucru afectează limba tuturor jucătorilor!'
    - ''
    permission-required:
    - ''
    - ' &ePentru a configura nLogin, trebuie să devii &cadministrator&e.'
    - ''
    - ' &6Adaugă permisiunea &f"{0}" &6la plugin-ul tău de permisiuni.'
    - ''
    - ' &c‼ &eConfigurarea va continua imediat ce permisiunea este adăugată.'
    - ''
    welcome-message:
    - ''
    - ' &aÎți mulțumim mult că ai ales nLogin! :)'
    - ''
    - ' &6Pentru siguranța ta, te rugăm să citești mesajul de mai jos:'
    - '  &cNu descărca niciodată nLogin din surse necunoscute.'
    - '  &cO versiune modificată poate conține software rău intenționat.'
    - ''
    - ' &aSurse de încredere:'
    - '  &7Website: &fnickuc.com'
    - '  &7GitHub: &fgithub.com/nickuc-com'
    - '  &7Instalatorul OpeNLogin (de pe &fSpigot &7sau &fGitHub&7)'
    - ''
    - ' &aSuport oficial:'
    - '  &7Documentație: &fdocs.nickuc.com/nlogin/'
    - '  &7Discord: &fnickuc.com/discord'
    - '  &7Email: &fsupport@nickuc.com'
    - ''
    configure-version-channel:
    - ''
    - ' &6Alege canalul de versiuni preferat.'
    - ''
    - ' &c‼ &ePoți schimba asta mai târziu rulând &f{0}&e.'
    - ''
