# Limbo设置
# - Limbo是玩家信息保护系统
# - 如果突然关机(例如电源故障),
#   limbo文件将生效
limbo:
  # 设置等待隐藏玩家信息的时间
  #
  # => 提供的值必须以刻度为单位. 要计算所需的价格变动,
  #    请将值(以秒为单位)乘以20
  #
  #   - 例子:
  #      2秒 X 20 ticks = 40 ticks
  #
  delay: 0

  # 设置 Limbo 是否应该隐藏玩家的信息
  #
  # => 玩家信息列表:
  #  - 速度和飞行模式;
  #  - 步行时的速度;
  #  - 生命值;
  #  - 饱食度;
  #  - [...]
  #
  # - 建议禁用此选项,以防与处理这些选项的其他
  #   插件(例如大厅插件)发生冲突
  hide-player-stats: true

  # 设置登录前是否应隐藏物品
  hide-player-inventory: true

  # 设置其他玩家登录前是否应隐藏
  # - 此选项可以防止服务器玩家列表中的机器人发送垃圾消息
  hide-unauthenticated-players: true

  # 设置在验证之前是否应锁定移动
  block-player-movement: true

  # 定义是否在登录前添加致盲效果。
  use-blindness-effect: false

  # Sets whether the player will be teleported to a safe position upon entering.
  # - It is recommended to activate the option if no spawn has been set.
  highest-block-location: false

  unrestricted:
    # 设置将跳过身份验证过程的用户名
    #
    # - 这个选项对于模仿玩家行为的
    #   模组或插件很有用
    #
    #   - 例子:
    #    - '[ThaumcraftTablet]'
    #    - '[BuildCraft]'
    #    - 'ComputerCraft'
    #
    # => 使用此功能的风险由你自行承担
    nicknames:
    #- '[ThaumcraftTablet]'
    #- '[BuildCraft]'
    #- 'ComputerCraft'

    # 设置登录前不锁定的物品栏名称
    # - 如果你是开发人员，最好为你的物品栏事件
    #   使用更高的优先级(例如 HIGH 或 HIGHEST),
    #   然后删除 nLogin 取消 - "Event#setCancelled(false)"
    inventories:
    #- 'My Inventory Name'

