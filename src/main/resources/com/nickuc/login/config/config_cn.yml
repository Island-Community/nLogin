# 常规安全设置
security:
  # 设置玩家验证的时间(以秒为单位)
  auth-timeout: 90

  # 设置是否在游戏中禁用高风险的 nLogin 命令
  # - 此选项可以防止删除管理员注册的黑客攻击
  force-console-usage: true

  nickname:
    # 设置用户名验证的正则表达式
    validation-regex: '([a-zA-Z0-9_]{3,16})'

    kick-unregistered:
      # 定义是否应阻止未注册玩家
      enable: false

      bypass:
        # 定义是否应忽略高级玩家的限制
        premium: false

        # 定义是否应忽略基岩版玩家的限制
        bedrock: false

        # 定义将被限制忽略的IP地址列表
        ips: []

  ip:
    # 设置插件是否忽略"此玩家已在线"检查 IP 是否与注册的相同.
    # - 如果玩家与服务器失去连接并尝试重新登录,此功能非常有用.
    bypass-online-check-with-same-ip: true

    limit:
      # 设置是否应限制每个 IP 可以有多少个帐户
      # - 此选项可以防止虚假帐户
      enable: true

      # 设置每个 IP 地址的最大记录数
      max: 3

      # 定义 IP 限制器是否应阻止账户进入服务器。
      prevent-login: false

      bypass:
        # 定义 IP 限制是否忽略注册玩家。
        registered: true

        # 定义 IP 限制是否应忽略高级玩家。
        premium: true

        # 定义 IP 限制是否应忽略基岩玩家。
        bedrock: true

        # 设置忽略限制的 IP 列表
        ips:
          - '127.0.0.1'
          - 'localhost'

  passwords:
    # 设置密码最小长度
    small: 5

    # 设置密码最大长度
    large: 32

    secure:
      # 定义是否应执行密码强度验证
      enable: false

      # 定义如果注册玩家的密码不符合安全密码模式，是否应要求其更新其密码
      enforce: false

      # 定义用于将密码分类为安全密码的模式
      #
      #  | 默认情况下，它会检查密码是否：
      #- |=> 1. 包含一个数字
      #- |=> 2. 包含大写英文字符
      #- |=> 3. 包含小写英文字符
      #- |=> 4. 包含一个特殊符号 (!"@#$%^&*?)
      #
      secure-regex: '(?=\S*\d)(?=\S*[A-Z])(?=\S*[a-z])(?=\S*[!@#$%^&*?])\S*$'

  bruteforce:
    # 设置玩家可以尝试的最大错误次数
    # - 使用值"1"时,玩家一旦犯错就会立即断开连接
    max-auth-tries: 1

    punish:
      # 设置是否将自动惩罚暴力破解攻击
      # - 在错误尝试次数过多后,可疑的 IP 地址将被阻止
      enable: true

      # 设置对疑似暴力破解攻击的惩罚时间(以分钟为单位)
      duration: 15

  hashing:
    # 设置使用的哈希算法
    #
    # - 可用选项:
    #
    #  | 哈希的计算成本应该从下到上增加(但不一定)
    #  |=> MD5
    #  |=> SHA256
    #  |=> SHA512
    #  |=> BCRYPT2Y
    #  |=> BCRYPT2A
    #  |=> PBKDF2
    #  |=> ARGON2ID
    #  |=> ARGON2I
    #  |=> ARGON2D
    #
    algorithm: "BCRYPT2A"

    bcrypt:
      rounds: 10

    pbkdf2:
      iterations: 10000
      algorithm: "HmacSHA512"

    argon2:
      iterations: 5
      memory: 32
      parallelism: 1

