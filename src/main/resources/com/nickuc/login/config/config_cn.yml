# 用户界面设置
ui:
  # 定义对话框的操作模式。
  # - 此功能仅适用于1.21.6及更高版本。
  #
  # - 可用选项:
  #  |=> NONE: 禁用对话框。
  #  |=> PRE_LOGIN: 在登录服务器前发送。
  #  |=> AFTER_LOGIN: 在登录服务器后发送。
  #
  show-dialogs: PRE_LOGIN

  # 设置是否发送屏幕消息
  use-title-bar: true

  # 设置是否发送动作栏中的消息
  use-action-bar: true

  # 设置是否发送剩余时间消息
  use-action-bar-timer: true

  # 设置是否发送音效
  use-sounds: true

  # 定义是否在身份验证完成之前禁用聊天消息
  remove-chat-messages: true

  # 设置是否删除加入消息
  remove-join-message: false

  # 设置 nLogin 语言是否应该适应 Minecraft 语言
  language-by-client: false

