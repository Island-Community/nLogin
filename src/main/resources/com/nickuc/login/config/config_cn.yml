# 数据库设置
database:
  # 设置使用的数据库类型
  #
  # - 可用选项:
  #  |=> MariaDB
  #  |=> MySQL
  #  |=> SQLite
  type: SQLite

  remote:
    # 设置 MariaDB/MySQL 信息
    # - 安装教程: https://docs.nickuc.com/nlogin/mysql
    hostname: "localhost:3306"
    database: "nLogin"
    username: "root"
    password: ""

    # 设置连接属性
    # - 如果你不知道自己在做什么,请勿更改此信息!
    properties:
      #useSSL: false
      #sslMode: disable
      #verifyServerCertificate: false
      useUnicode: true
      characterEncoding: "utf8"

  # 设置连接池设置
  # - 如果你不知道自己在做什么,请勿更改此信息!
  pool-settings:
    maximum-pool-size: 10
    minimum-idle: 10
    maximum-lifetime: 1800000 # 30分钟
    connection-timeout: 5000 # 5秒

  table:
    account:
      # 设置 nLogin 账户表的名称
      # - 如果你不知道自己在做什么,请勿更改此信息!
      table-name: "nlogin"

      # 设置列的名称.
      # - 如果你不知道自己在做什么,请勿更改此信息!
      columns:
        ai: "ai"
        last-name: "last_name"
        unique-id: "unique_id"
        mojang-id: "mojang_id"
        bedrock-id: "bedrock_id"
        password: "password"
        premium: "premium"
        last-ip: "last_ip"
        last-seen: "last_seen"
        creation-date: "creation_date"
        email: "email"
        discord: "discord"
        settings: "settings"

    data:
      # 设置 nLogin 数据表的名称
      # - 如果你不知道自己在做什么,请勿更改此信息!
      table-name: "nlogin_data"

      # 设置列的名称
      # - 如果你不知道自己在做什么,请勿更改此信息!
      columns:
        id: "id"
        key: "key"
        value: "value"

# 信息服务设置
redis:
  # 定义 Redis 信息。
  enable: false
  hostname: localhost
  username: ""
  password: ""
  ssl: false

