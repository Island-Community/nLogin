# 命令设置
commands:
  # 设置注册后要执行的命令列表
  #
  # - 可用选项:
  #  |=> @console: 在控制台上执行命令
  #  |=> @delay <时间以tick为单位>: 为命令添加延迟
  #  |=> @proxy: 在代理服务器上运行该命令(仅当你使用代理服务器时)
  #  |=> @server <服务器用","分隔>: 只有玩家连接到特定服务器列表时才
  #      执行命令(仅在使用代理服务器时)
  #
  #      例子: @server lobby1,lobby2
  #
  after-register:
  #- "@console tell @player 欢迎来到服务器!" # 在控制台中运行
  #- "@delay 40 /kit starter" # 等待 40 个tick (2秒)

  # 设置身份验证后要执行的命令列表
  #
  # - 可用选项:
  #  |=> @console: 在控制台上执行命令
  #  |=> @delay <时间以tick为单位>: 为命令添加延迟
  #  |=> @proxy: 在代理服务器上运行该命令(仅当你使用代理服务器时)
  #  |=> @server <服务器用","分隔>: 只有玩家连接到特定服务器列表时才
  #      执行命令(仅在使用代理服务器时)
  #
  #      例子: @server lobby1,lobby2
  #
  after-login:
  #- "@console @proxy send @player lobby" # 在代理控制台中运行(bungee,velocity等)

  # 在身份验证之前设置允许的命令列表
  allowed-commands:
  #- "/loginstaff"

  changepass:
    enable: true
    commands: [changepass, changepassword]
    description: 更改注册密码的命令
    permission: null
  discord:
    enable: true
    commands: [discord]
    description: 使用 Discord 账户控制 2FA 的命令
    permission: nlogin.command.discord
  email:
    enable: true
    commands: [email]
    description: 使用电子邮件账户控制 2FA 的命令
    permission: nlogin.command.email
  login:
    enable: true
    commands: [login, l, log]
    description: 登录服务器的命令
    permission: null
  offline:
    enable: true
    commands: [offline, cracked]
    description: 将你的账户标记为离线的命令
    permission: null
  premium:
    enable: true
    commands: [premium]
    description: 将你的账户标记为正版的命令
    permission: null
  recover:
    enable: true
    commands: [recover]
    description: 用于恢复注册账户访问权限的命令
    permission: null
  register:
    enable: true
    commands: [register, reg]
    description: 注册账户的命令
    permission: null
  unregister:
    enable: false
    commands: [unregister]
    description: 取消注册的命令
    permission: null