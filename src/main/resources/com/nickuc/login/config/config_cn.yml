# 配置文件的版本
language-version: 11

# 设置插件的语言
#
# - 可用翻译:
#
#  |=> 阿拉伯语: messages_ar.yml
#  |=> 保加利亚语: messages_bg.yml
#  |=> 简体中文: messages_cn.yml
#  |=> 捷克语: messages_cz.yml
#  |=> 德语: messages_de.yml
#  |=> 英语: messages_en.yml
#  |=> 西班牙语: messages_es.yml
#  |=> 法语: messages_fr.yml
#  |=> 匈牙利语: messages_hu.yml
#  |=> 印度尼西亚语: messages_id.yml
#  |=> 意大利语: messages_it.yml
#  |=> 日语：messages_jp.yml
#  |=> 立陶宛语: messages_lt.yml
#  |=> 波兰语: messages_pl.yml
#  |=> 葡萄牙语: messages_br.yml
#  |=> 罗马尼亚语: messages_ro.yml
#  |=> 俄语: messages_ru.yml
#  |=> 土耳其语: messages_tr.yml
#  |=> 乌克兰: messages_ua.yml
#  |=> 越南语: messages_vn.yml
#
# - 更改语言时，当前文件不会被重置
language-file: "messages_cn.yml"

