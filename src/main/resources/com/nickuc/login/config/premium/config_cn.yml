####################################################################################################

# 配置文件的版本
language-version: 11

# 定义当识别出具有高级昵称的玩家时要执行的操作
#
#  (!) 仅当禁用"username-appender"选项时,此选项才可用
#
# - 可用选项:
#  |=> DETECT
#    - 通过选择此选项，玩家将自动注册为高级玩家
#
#    (!) 使用正版帐户用户名的离线玩家将在首次登录
#        服务器时收到不可自设置的"无效会话"消息
#
#  |=> RESTRICT
#    - 选择此选项后，玩家将自动注册为高级玩家，但离线玩家将无法使用高级昵称
#
#  |=> NONE
#    - 选择此选项后将不会采取任何行动
#
premium-nickname: DETECT

# 定义使用高级 UUID 识别玩家时要执行的操作
#
#  (!) 该选项仅适用于最新版本（1.19.1+）
#
# - 可用选项:
#  |=> DETECT
#    - 通过选择此选项，玩家将自动注册为高级玩家
#
#  |=> RESTRICT
#    - 选择此选项后，玩家将自动注册为高级玩家，但离线玩家将无法使用高级 UUID
#
#  |=> NONE
#    - 选择此选项后将不会采取任何行动
#
premium-id: DETECT

# 设置玩家是否应该收到询问其帐户是否为正版帐户的通知
# - 如果你想确保正版玩家收到Mojang UUID,建议使用此选项
premium-question: true

#     _        ___      ___      __        __       ___      __      __
#    /_\      / _ \    / _ \    /__\    /\ \ \     /   \    /__\    /__\
#   //_\\    / /_)/   / /_)/   /_\     /  \/ /    / /\ /   /_\     / \//
#  /  _  \  / ___/   / ___/   //__    / /\  /    / /_//   //__    / _  \
#  \_/ \_/  \/       \/       \__/    \_\ \/    /___,'    \__/    \/ \_/

username-appender:
  # 设置插件是否应为用户名添加扩展名
  # - 建议使用此功能来区分正版玩家和离线玩家
  #
  # - 你可以自由更改此选项: 玩家的数据不会丢失
  #
  # - 如需更多信息,请访问文档:
  #    * https://docs.nickuc.com/nlogin/username-appender
  #
  enable: true

  premium:
    # 设置添加到正版玩家用户名的前缀或后缀
    username-appendix: ""

    # 设置添加到正版玩家用户名的位置
    #
    # - 可用选项:
    #  |=> PREFIX (用户名前)
    #  |=> SUFFIX (用户名后)
    #
    position: "suffix"

    # 设置将用于识别正版玩家的域名列表
    # - 接受正则表达式
    # - 要检查的域名将始终为小写
    domains:
    #- "premium.myserver.com"

  offline:
    # 设置添加到离线玩家用户名的前缀或后缀
    username-appendix: "+"

    # 设置添加到离线玩家用户名的位置
    #
    # - 可用选项:
    #  |=> PREFIX (用户名前)
    #  |=> SUFFIX (用户名后)
    #
    position: "suffix"

    # 设置用于识别离线玩家的域名列表
    # - 接受正则表达式
    # - 要检查的域名将始终为小写
    domains:
    #- "myserver.com"

#     _               _____      ___      __      ___      ___     _____        __
#    /_\     /\ /\   /__   \    /___\    / /     /___\    / _ \    \_   \    /\ \ \
#   //_\\   / / \ \    / /\/   //  //   / /     //  //   / /_\/     / /\/   /  \/ /
#  /  _  \  \ \_/ /   / /     / \_//   / /___  / \_//   / /_\\   /\/ /_    / /\  /
#  \_/ \_/   \___/    \/      \___/    \____/  \___/    \____/   \____/    \_\ \/

autologin:
  bedrock:
    # 设置基岩玩家是否应自动进行身份验证
    # - 你可以自由更改此设置: 已注册的用户
    #   不会受到此更改的影响
    enable: true

    # 设置基岩玩家是否应跳过注册
    # - 如果你在 Web 集成(例如服务器网站)
    #   中使用玩家密码,建议禁用此选项
    skip-register: true

    # 设置是否使用数据库 UUID,而不是 Floodgate 提供的 UUID
    use-database-uuid: false

  premium:
    # 设置正版玩家是否应自动进行身份验证
    # - 你可以自由更改此设置: 已注册的用户
    #   不会受到此更改的影响。
    enable: true

    # 定义服务器离线时，高级玩家是否可以使用已注册的密码登录。
    # - 未注册密码的高级用户仍可注册，不会因这项更改而受到任何影响。
    allow-if-offline: false

    # 设置正版玩家是否应跳过注册
    # - 如果你在 Web 集成(例如服务器网站)
    #   中使用玩家密码,建议禁用此选项
    skip-register: true

  session:
    # 设置是否使用登录会话
    # - 如果玩家在超时后登录并继续使用
    #   相同的 IP 地址,身份验证将被忽略
    enable: true

    # 设置登录会话的持续时间(以分钟为单位)
    # => 如果玩家的 IP 是公共的(代理,公共 VPN,共享网络)
    #   或者切换太快(在具有动态 IP 的 ISP 上),
    #   那么过长的会话时间可能会造成漏洞
    duration: 1

    bypass:
      # 定义应从登录会话中忽略哪些玩家。
      nicknames: []

      # 定义应从登录会话中忽略哪些IP地址。
      ips: []