autologin:
  bedrock:
    # Define se jogadores Bedrock deverão autenticar automaticamente.
    # - Você pode alterar esta opção livremente: usuários já registrados
    #   NÃO estarão vulneráveis por esta mudança
    enable: true

    # Define se jogadores Bedrock deverão pular o registro.
    # - É recomendado desativar esta opção se você utiliza as
    #   senhas dos jogadores em uma integração web (ex.: site do servidor).
    skip-register: true

    # Define se o UUID da database será usado em vez do fornecido pelo Floodgate.
    use-database-uuid: false

  premium:
    # Define se jogadores premium deverão autenticar automaticamente.
    # - Você pode alterar esta opção livremente: usuários já registrados
    #   NÃO estarão vulneráveis por esta mudança.
    enable: true

    # Define se os jogadores premium poderão entrar usando a senha registrada se os servidores estiverem offline.
    # - Usuários premium sem uma senha registrada poderão se registrar e
    #   NÃO estarão vulneráveis por esta mudança.
    allow-if-offline: false

    # Define se jogadores premium deverão pular o registro.
    # - É recomendado desativar esta opção se você utiliza as
    #   senhas dos jogadores em uma integração web (ex.: site do servidor).
    skip-register: true

  session:
    # Define se sessões de login serão utilizadas.
    # - A autenticação será ignorada se o jogador entrar no servidor no tempo limite
    #   e continuar usando o mesmo endereço de IP.
    enable: true

    # Define a duração (em minutos) das sessões de login.
    # => Tempos de sessões muito longas podem abrir vulnerabilidades se o IP do jogador
    #    for público (proxies, VPNs públicas, redes compartilhadas)
    #    ou se alternar muito rapidamente (em ISPs com IP dinâmico).
    duration: 1

    bypass:
      # Define quais jogadores deverão ser ignorados das sessões de login.
      nicknames: []

      # Define quais IPs deverão ser ignorados das sessões de login.
      ips: []