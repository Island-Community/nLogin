# Define a versão do arquivo.
language-version: 1

# Define qual será o comportamento ao identificar jogadores com nickname premium
#
#  (!) Esta opção só está disponível se a opção "username-appender" estiver desativada.
#
# - Opções disponíveis:
#  |=> DETECT
#    - Ao escolher essa opção, os jogadores serão registrados como premium automaticamente.
#
#    (!) Jogadores offline que estejam usando o nickname de uma conta premium poderão receber
#        uma mensagem não customizável de "Sessão inválida" na primeira entrada ao servidor.
#
#  |=> RESTRICT
#    - Ao escolher essa opção, os jogadores serão registrados como premium automaticamente, mas um jogador offline não poderá usar um nickname premium.
#
#  |=> NONE
#    - Ao escolher essa opção, nenhuma ação será realizada.
#
premium-nickname: DETECT

# Define qual será o comportamento ao identificar jogadores com UUID premium
#
#  (!) Este recurso só funciona para versões mais recentes (1.19.1+)
#
# - Opções disponíveis:
#  |=> DETECT
#    - Ao escolher essa opção, os jogadores serão registrados como premium automaticamente.
#
#  |=> RESTRICT
#    - Ao escolher essa opção, os jogadores serão registrados como premium automaticamente, mas um jogador offline não poderá usar um nickname premium.
#
#  |=> NONE
#    - Ao escolher essa opção, nenhuma ação será realizada.
#
premium-id: DETECT

# Define se os jogadores poderão receber uma notificação perguntando se suas contas são premium.
# - Esta opção é recomendada se você quer garantir que os jogadores premium recebam o UUID da Mojang.
premium-question: true

