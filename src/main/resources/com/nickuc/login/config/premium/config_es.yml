# Establece la versión del archivo.
language-version: 3

# Define qué hacer cuando se identifican jugadores con apodos premium.
#
#  (!) Esta opción sólo está disponible si la opción "username-appender" está desactivada.
#
# - Opciones disponibles:
#  |=> DETECT
#    - Al seleccionar esta opción, los jugadores se registrarán automáticamente como premium.
#
#    (!) Los jugadores sin conexión que utilicen un apodo de cuenta premium pueden recibir un mensaje
#        no personalizable de "Sesión no válida" al iniciar sesión por primera vez en el servidor.
#
#  |=> RESTRICT
#    - Al seleccionar esta opción, los jugadores se registrarán automáticamente como premium, pero un jugador sin conexión no podrá utilizar un apodo premium.
#
#  |=> NONE
#    - Al seleccionar esta opción, no se realizará ninguna acción.
#
premium-nickname: DETECT

# Define qué hacer cuando se identifican jugadores con UUID premium.
#
#  (!) Esta opción solo funciona en las versiones más recientes (1.19.1+).
#
# - Opciones disponibles:
#  |=> DETECT
#    - Al seleccionar esta opción, los jugadores se registrarán automáticamente como premium.
#
#  |=> RESTRICT
#    - Al seleccionar esta opción, los jugadores se registrarán automáticamente como premium, pero un jugador sin conexión no podrá utilizar un UUID premium.
#
#  |=> NONE
#    - Al seleccionar esta opción, no se realizará ninguna acción.
#
premium-id: DETECT

# Establece si los jugadores pueden recibir una notificación preguntando si sus cuentas son premium.
# - Se recomienda esta opción si quieres asegurarte de que los jugadores premium reciben el UUID de Mojang.
premium-question: true

