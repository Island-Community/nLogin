####################################################################################################

# Define a versão do arquivo.
language-version: 1

# Define se o Discord poderá ser usado como um segundo fator.
enable: false

authentication:
  # Define o token utilizado na API do Discord.
  #
  # - Para mais informações, acesse a documentação:
  #    * https://docs.nickuc.com/nlogin/discord
  #
  token: ""

  # Define a mensagem de status do bot.
  presence: ""

  proxy:
    enable: false
    host: "https://domain.tld"
    port: 80
    username: "username"
    password: "password"

linking:
  # Define a URL de convite do servidor do Discord.
  # - Esta opção é necessária para concluir uma vinculação.
  invite-url: "https://discord.gg/YOUR_INVITE_CODE"

  # Define se a vinculação deverá ser recomendada para os jogadores.
  recommend: true

  # Define se o 2FA será ativado ao concluir a vinculação.
  enable-2fa: true

  required:
    # Define se vincular uma conta do Discord será exigido para se autenticar.
    enable: false

    # Define se jogadores originais também precisarão vincular uma conta do Discord para se autenticar.
    enable-for-premium: true

    # Define se jogadores Bedrock também precisarão vincular uma conta do Discord para se autenticar.
    enable-for-bedrock: true

account:
  # Define o número máximo de contas que podem ter o mesmo Discord vinculado.
  limit: 1

  # Define há quanto tempo (em segundos) uma conta precisa ter sido criada para ser aceita para vincular.
  # - O valor padrão é de 5 minutos (600 segundos)
  # - Para desativar o tempo de verificação do registro da conta, troque o valor para "-1".
  block-recent: 600

  # Define se uma nova senha deverá ser criada após o processo de recuperação da conta.
  # - Se esta opção estiver desativada, uma senha aleatória será definida.
  force-password-update: false