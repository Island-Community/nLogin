plugins {
    id 'java'
}

group = 'com.nickuc.login'
version = '2.0.19-remapped'
description = 'nLogin remapped sources (IDE ready, Java 17)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

repositories {
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://repo.minebench.de/' }
    maven { url 'https://repo.codemc.io/repository/maven-public/' }
    maven { url 'https://repo.opencollab.dev/maven-releases/' }
    maven { url 'https://repo.opencollab.dev/maven-snapshots/' }
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://repo.citizensnpcs.co/' }
    maven { url 'https://jitpack.io' }
    maven { url 'https://repo.nickuc.com/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'
    compileOnly 'net.md-5:bungeecord-api:1.21-R0.4-SNAPSHOT'
    compileOnly 'com.velocitypowered:velocity-api:3.1.0'
    compileOnly 'org.geysermc.floodgate:api:2.2.3-SNAPSHOT'
    compileOnly 'org.geysermc.cumulus:cumulus:1.1.2'

    implementation 'com.github.retrooper:packetevents-api:2.12.1'
    implementation 'com.github.retrooper:packetevents-spigot:2.12.1'
    implementation 'com.github.retrooper:packetevents-velocity:2.12.1'
    implementation 'com.github.retrooper:packetevents-bungeecord:2.12.1'
    implementation 'io.netty:netty-all:4.1.100.Final'

    implementation 'net.kyori:adventure-api:4.17.0'
    implementation 'net.kyori:adventure-text-serializer-legacy:4.17.0'

    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    implementation 'com.google.guava:guava:33.2.1-jre'

    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'org.xerial:sqlite-jdbc:3.46.0.0'
    implementation 'com.h2database:h2:2.2.224'
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.3.3'
    implementation 'com.mysql:mysql-connector-j:8.4.0'
    implementation 'org.postgresql:postgresql:42.7.4'

    implementation 'redis.clients:jedis:5.2.0'

    implementation 'org.json:json:20241224'
    implementation 'org.yaml:snakeyaml:2.2'
    implementation 'net.lingala.zip4j:zip4j:2.11.5'

    implementation 'de.mkammerer:argon2-jvm:2.11'
    implementation 'at.favre.lib:bcrypt:0.10.2'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcpg-jdk18on:1.78.1'

    implementation 'org.apache.commons:commons-email:1.5'
    implementation('net.dv8tion:JDA:6.0.0') {
        exclude group: 'club.minnced', module: 'opus-java'
    }
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'org.slf4j:slf4j-api:2.0.12'
    implementation 'org.apache.logging.log4j:log4j-api:2.23.1'
    compileOnly 'org.apache.logging.log4j:log4j-core:2.23.1'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    compileOnly 'net.citizensnpcs:citizensapi:2.0.35-SNAPSHOT'
    compileOnly 'com.mojang:authlib:1.5.21'
    compileOnly 'net.md-5:bungeecord-proxy:1.21-R0.4-SNAPSHOT'

    implementation 'me.lucko:jar-relocator:1.7'
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(17)
    options.compilerArgs += ['-Xlint:-unchecked', '-Xlint:-deprecation']
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    filteringCharset = 'UTF-8'
}
